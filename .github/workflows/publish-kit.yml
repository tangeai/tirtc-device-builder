name: Publish ESP32 Device Kit

on:
  push:
    tags:
      - "kit-esp32s3-v*"

permissions:
  contents: write

concurrency:
  group: esp32-kit-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify tag and pinned metadata
        run: |
          expected_tag="$(node --input-type=module -e "import { ESP32_KIT } from './bin/esp32-kit-metadata.js'; process.stdout.write(ESP32_KIT.releaseTag)")"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"

      - name: Fetch pinned ThingConnect source
        run: |
          source_commit="$(node --input-type=module -e "import { ESP32_KIT } from './bin/esp32-kit-metadata.js'; process.stdout.write(ESP32_KIT.sourceCommit)")"
          git clone --no-checkout https://github.com/tangeai/tirtc-server-example.git upstream
          git -C upstream checkout --detach "${source_commit}"

      - run: npm ci --ignore-scripts

      - name: Reproduce Device Kit twice
        run: |
          kit_version="$(node --input-type=module -e "import { ESP32_KIT } from './bin/esp32-kit-metadata.js'; process.stdout.write(ESP32_KIT.version)")"
          archive_name="$(node --input-type=module -e "import { ESP32_KIT } from './bin/esp32-kit-metadata.js'; process.stdout.write(ESP32_KIT.archiveName)")"
          npm run pack:esp32-kit -- \
            --source upstream/thing-connect \
            --kit-version "${kit_version}" \
            --output dist-first
          npm run pack:esp32-kit -- \
            --source upstream/thing-connect \
            --kit-version "${kit_version}" \
            --output dist-second
          cmp "dist-first/${archive_name}" "dist-second/${archive_name}"
          mkdir dist
          cp "dist-first/${archive_name}" "dist/${archive_name}"
          cp "dist-first/${archive_name}.sha256" "dist/${archive_name}.sha256"
          cd dist
          sha256sum -c "${archive_name}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_name="$(node --input-type=module -e "import { ESP32_KIT } from './bin/esp32-kit-metadata.js'; process.stdout.write(ESP32_KIT.archiveName)")"
          kit_version="$(node --input-type=module -e "import { ESP32_KIT } from './bin/esp32-kit-metadata.js'; process.stdout.write(ESP32_KIT.version)")"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${archive_name}" \
            "dist/${archive_name}.sha256" \
            --verify-tag \
            --latest=false \
            --title "TiRTC ESP32-S3 Device Kit ${kit_version}" \
            --notes "ESP-IDF 5.5.x; TiRTC SDK 2.3.0; pinned generated H5/AI starter and runtime/media contracts."
